name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # let other matrix jobs finish even if one fails
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > backend/backend/.env

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            pkg-config \
            gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Tests
        working-directory: backend
        env:
          # Django
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          # Database — use SQLite for CI so no RDS needed
          DB_ENGINE: "django.db.backends.sqlite3"
          DB_NAME: ":memory:"
          DB_USER: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
          # Qdrant — dummy values, tests don't hit the real cluster
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "ci-dummy"
          QDRANT_COLLECTION: "documents"
          # AWS — dummy values, tests don't call real AWS
          AWS_ACCESS_KEY_ID: "ci-dummy"
          AWS_SECRET_ACCESS_KEY: "ci-dummy"
          AWS_REGION: "us-east-1"
          S3_BUCKET: "ci-dummy"
          TRANSCRIBE_OUTPUT_BUCKET: "ci-dummy"
          BEDROCK_MODEL_ID: "anthropic.claude-3-5-sonnet-20241022-v2:0"
          RAG_TOP_K: "5"
        run: |
          python manage.py test --verbosity=2

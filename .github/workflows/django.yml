name: CI

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests are offline: dummy values only, nothing here is a real credential.
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install pinned dependencies (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint
        run: ruff check ..

      - name: Django system check
        run: python manage.py check --settings=backend.test_settings

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=backend.test_settings

      - name: Tests (with coverage)
        run: |
          coverage run --source=app,Services --omit="*/migrations/*,*/test*.py" manage.py test --verbosity=1 --settings=backend.test_settings
          coverage report --skip-empty

      # The evaluation's scoring rules are pure Python with no model calls, so they
      # are checked on every push: a wrong metric produces confident wrong numbers.
      - name: Evaluation metric tests
        working-directory: evals
        run: python -m unittest discover -p "test_*.py" -v

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: SECRET_KEY=ci docker compose config -q

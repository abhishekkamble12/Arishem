version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Arishem — Full Stack Development & Production Compose Stack
#
# Services:
#   redis    — In-memory message broker for Celery task queues
#   migrate  — One-shot container that executes DB migrations then exits
#   api      — Django REST Framework + Gunicorn API server (Port 8000)
#   celery   — Background worker for async document ingestion & transcription
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Message Broker ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database migration (runs once, then exits) ──────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             echo '✅ Migrations complete'"
    restart: "no"

  # ── API server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/app/auth/workspaces')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Background Worker ────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    command: celery -A backend worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

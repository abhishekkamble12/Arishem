version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Arishem — local development stack
#
# Services:
#   api      — Django + Gunicorn (your backend)
#   migrate  — one-shot container that runs DB migrations then exits
#
# External services (not run locally — use the real cloud endpoints):
#   MySQL    — AWS RDS  (set DB_HOST in .env)
#   Qdrant   — Qdrant Cloud (set QDRANT_URL / QDRANT_API_KEY in .env)
#   AWS      — S3 / Transcribe / Bedrock (set AWS_* in .env)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database migration (runs once, then exits) ──────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             echo '✅ Migrations complete'"
    restart: "no"

  # ── API server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

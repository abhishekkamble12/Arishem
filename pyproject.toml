# Tooling config only. Runtime dependencies are pinned in backend/requirements*.txt,
# which is what Docker and CI install.
[project]
name = "arishem"
version = "0.1.0"
description = "Multi-tenant RAG backend with async Celery ingestion, workspace-isolated vector search and a RAGAS evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", ".venv", "backend/app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "S112"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/app/test*.py" = ["B011"]
"backend/backend/settings.py" = ["E402"]
"backend/backend/test_settings.py" = ["F403", "F405"]
# Standalone scripts adjust sys.path / env before importing project modules.
"backend/*.py" = ["E402"]
"evals/*.py" = ["E402"]

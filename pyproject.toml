[project]
name = "arishem"
version = "0.1.0"
description = "Production-oriented, validated end-to-end RAG platform with async Celery ingestion, Groq inference, and quantitative RAGAS evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-decouple>=3.8",
    "django>=6.0.5",
    "djangorestframework>=3.17.1",
    "mysqlclient>=2.2.8",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "boto3>=1.43.9",
    "pymupdf>=1.27.2.3",
    "langchain-qdrant>=1.1.0",
    "faster-whisper>=1.2.1",
    "yt-dlp>=2024.5.27",
]

[tool.uv.workspace]
members = [
    "backend",
]

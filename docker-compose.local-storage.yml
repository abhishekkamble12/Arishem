# Local development stack: Postgres, Qdrant, MinIO (S3-compatible), Redis, API, worker, beat.
# Reproducible with only a .env containing SECRET_KEY and GROQ_API_KEY (see .env.example).
# Production uses managed Postgres/Qdrant/object storage instead; see docs/DEPLOY.md when it exists.

x-app: &app
  build: ./backend
  restart: unless-stopped
  volumes: [localstore:/home/arishem/app/local_storage]
  environment: &app-env
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DEBUG: "True"                     # local only: disables the HTTPS redirect
    ALLOWED_HOSTS: localhost,127.0.0.1
    CORS_ALLOWED_ORIGINS: http://localhost:5173
    DATABASE_URL: postgres://arishem:arishem@postgres:5432/arishem
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: documents
    STORAGE_BACKEND: local
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CACHE_URL: redis://redis:6379/2
    GROQ_API_KEY: ${GROQ_API_KEY:-}
  depends_on: &app-deps
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    qdrant: {condition: service_started}

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: arishem, POSTGRES_PASSWORD: arishem, POSTGRES_DB: arishem}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arishem"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes: [qdrant:/qdrant/storage]

  migrate:
    <<: *app
    restart: "no"
    command: python manage.py migrate --noinput

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      <<: *app-deps
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/app/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    # Each worker process loads its own copy of the embedding model (~400 MB) at
    # start-up. Unpinned, Celery starts one process per CPU core.
    command: celery -A backend worker --concurrency 2 --loglevel=info
    depends_on:
      <<: *app-deps
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *app
    command: celery -A backend beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      <<: *app-deps
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  qdrant:
  localstore:

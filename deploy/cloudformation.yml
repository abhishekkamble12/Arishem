AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Arishem — multi-tenant RAG backend on a single EC2 instance running Docker Compose,
  with S3 for documents. Deliberately avoids the expensive managed pieces (ALB, NAT
  gateway, RDS, ElastiCache) because one small box runs the whole stack for a demo.
  See docs/DEPLOY.md for the cost breakdown and when to outgrow this shape.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Size and cost}
        Parameters: [InstanceType, Architecture, RootVolumeGiB, BackupRetentionDays, MonthlyBudgetUSD, AlertEmail]
      - Label: {default: Application}
        Parameters: [RepoUrl, RepoBranch, DomainName]

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t3.small, t3.medium]
    Description: >
      t4g.small (2 GiB, ARM) is the cheapest size the stack fits in. Use a t3.*
      only if you need x86; it costs about twice as much for the same memory.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match InstanceType — arm64 for t4g.*, x86_64 for t3.*.
  RootVolumeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100
    Description: 30 GiB fits the Docker images (torch is large) with room for data.
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 90
    Description: >
      How many daily snapshots of the volume to keep. Snapshots are incremental and
      billed only for blocks in use, at $0.05/GB-month in ap-south-1.
  MonthlyBudgetUSD:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >
      Emails you at 80% actual and 100% forecast spend. Budgets are free. The
      default leaves headroom over the ~$15/month steady state so the 80%
      threshold is a warning, not a greeting.
  AlertEmail:
    Type: String
    AllowedPattern: ".+@.+\\..+"
    Description: >
      Where budget and operational alarms go. Confirm the SNS subscription email
      AWS sends after the first deploy, or the alarms have nobody to tell.
  RepoUrl:
    Type: String
    Default: https://github.com/abhishekkamble12/Arishem.git
  RepoBranch:
    Type: String
    Default: main
  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional. With a domain whose DNS already points at this stack's Elastic IP,
      Caddy gets a free Let's Encrypt certificate. Left empty, the site is HTTP only.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      Optional OAuth 2.0 Web client ID for Google sign-in. A public identifier,
      not a secret, which is why it is a plain parameter. Left empty,
      /auth/google answers 503 and email sign-in still works.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # ── Documents ───────────────────────────────────────────────────────────────
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-docs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Half-finished multipart uploads are invisible but still billed.
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  # ── Instance identity ───────────────────────────────────────────────────────
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Shell access through Session Manager, so the stack opens no SSH port
        # and needs no key pair.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: documents-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt DocumentsBucket.Arn
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Secrets live in Parameter Store (free), never in this template.
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/arishem/*"
        - PolicyName: write-app-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Docker's awslogs driver writes container stdout here; metrics come
              # from the EMF lines in it, so no cloudwatch:PutMetricData is needed.
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${AppLogGroup.Arn}:*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ── Network ─────────────────────────────────────────────────────────────────
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Arishem web ingress (no SSH; use SSM Session Manager)
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref Instance

  # ── The box ─────────────────────────────────────────────────────────────────
  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      # The stack only succeeds once the app answers its own health check.
      ResourceSignal: {Count: 1, Timeout: PT40M}
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-${Architecture}}}"
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3          # gp3 is cheaper than gp2 at the same size
            DeleteOnTermination: true
            Encrypted: true
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
      Tags:
        - {Key: Name, Value: !Ref AWS::StackName}
        # Selects this instance for the daily snapshot policy below.
        - {Key: arishem-backup, Value: !Ref AWS::StackName}
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -xo pipefail
            exec > >(tee /var/log/arishem-bootstrap.log) 2>&1

            # Whatever happens, tell CloudFormation rather than hanging for 40 minutes.
            dnf install -y aws-cfn-bootstrap || true
            signal() { /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} \
                       --resource Instance --region ${AWS::Region} || true; }
            trap 'signal 1' ERR

            set -e
            dnf update -y
            dnf install -y docker git

            # 4 GiB of swap: pip unpacking torch peaks well above 2 GiB of RAM.
            if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=4096
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            systemctl enable --now docker
            DOCKER_PLUGINS=/usr/local/lib/docker/cli-plugins
            mkdir -p "$DOCKER_PLUGINS"
            ARCH=$(uname -m)
            curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-$ARCH" \
                 -o "$DOCKER_PLUGINS/docker-compose"
            chmod +x "$DOCKER_PLUGINS/docker-compose"

            git clone --branch ${RepoBranch} --depth 1 ${RepoUrl} /opt/arishem
            cd /opt/arishem

            get_secret() { aws ssm get-parameter --with-decryption --region ${AWS::Region} \
                           --name "$1" --query Parameter.Value --output text; }

            # A Postgres password only ever used inside the Docker network.
            DB_PASSWORD=$(openssl rand -hex 24)

            cat > /opt/arishem/.env <<ENVEOF
            SECRET_KEY=$(get_secret /arishem/secret_key)
            GROQ_API_KEY=$(get_secret /arishem/groq_api_key)
            DB_PASSWORD=$DB_PASSWORD
            DATABASE_URL=postgres://arishem:$DB_PASSWORD@postgres:5432/arishem
            OBJECT_STORAGE_BUCKET=${DocumentsBucket}
            OBJECT_STORAGE_REGION=${AWS::Region}
            PUBLIC_HOST=${PublicHost}
            SITE_ADDRESS=${SiteAddress}
            PUBLIC_ORIGIN=${PublicOrigin}
            SECURE_SSL_REDIRECT=${SslRedirect}
            GOOGLE_CLIENT_ID=${GoogleClientId}
            LOG_GROUP=${AppLogGroup}
            AWS_REGION=${AWS::Region}
            ENVEOF
            chmod 600 /opt/arishem/.env

            docker compose -f docker-compose.prod.yml up -d --build

            # The stack is only "up" when the API actually answers.
            for i in $(seq 1 60); do
              if curl -fsS http://localhost/app/health >/dev/null; then
                signal 0; exit 0
              fi
              sleep 10
            done
            signal 1
          - PublicHost: !Ref ElasticIP
            SiteAddress: !If [HasDomain, !Ref DomainName, ":80"]
            PublicOrigin: !If
              - HasDomain
              - !Sub "https://${DomainName}"
              - !Sub "http://${ElasticIP}"
            SslRedirect: !If [HasDomain, "True", "False"]

  # ── Backups ─────────────────────────────────────────────────────────────────
  # Postgres and Qdrant both live on the instance's one volume, so snapshotting
  # the instance backs up both. The snapshots are crash-consistent, the same state
  # as pulling the power. Postgres replays its WAL on start, and so does Qdrant,
  # so a restored volume comes back the way a server does after an outage.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: dlm.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole"

  DailySnapshots:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub "Daily snapshots of the ${AWS::StackName} instance"
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - {Key: arishem-backup, Value: !Ref AWS::StackName}
        Schedules:
          - Name: daily
            CopyTags: true
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times: ["20:30"]   # UTC; 02:00 in India, when nobody is uploading
            RetainRule:
              Count: !Ref BackupRetentionDays

  # ── Logs, metrics and alarms ────────────────────────────────────────────────
  # The API and worker log to CloudWatch through Docker's awslogs driver, and
  # print metrics in Embedded Metric Format (backend/app/observability.py), which
  # CloudWatch extracts from those logs. See docs/DEPLOY.md for what this costs.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/arishem/${AWS::StackName}"
      RetentionInDays: 14

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]

  # Users feel this first. No traffic is not an outage, so missing data is fine.
  QueryLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 query latency over 10 s in 2 of the last 3 five-minute periods.
      Namespace: Arishem
      MetricName: QueryLatency
      Dimensions: [{Name: Service, Value: api}]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # QueryError is 0 or 1 per query, so its average is the error rate. The IF
  # ignores five-minute windows with fewer than 10 queries: at demo traffic one
  # failure in three queries is 33% and would page someone over nothing.
  QueryErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Over 5% of queries failed in 2 of the last 3 five-minute periods (min. 10 queries).
      Metrics:
        - Id: rate
          MetricStat:
            Metric: {Namespace: Arishem, MetricName: QueryError, Dimensions: [{Name: Service, Value: api}]}
            Period: 300
            Stat: Average
          ReturnData: false
        - Id: n
          MetricStat:
            Metric: {Namespace: Arishem, MetricName: QueryError, Dimensions: [{Name: Service, Value: api}]}
            Period: 300
            Stat: SampleCount
          ReturnData: false
        - Id: gated
          Expression: IF(n >= 10, rate, 0)
          Label: Error rate (windows with 10+ queries)
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 0.05
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # The age of the oldest waiting document, not the count: a long queue that is
  # moving is load, a short one that is not moving is a stuck worker.
  IngestionStuckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A document has waited over 15 minutes to be ingested.
      Namespace: Arishem
      MetricName: OldestPendingSeconds
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # The worker's beat schedule publishes queue metrics every minute. When they
  # stop, the worker (or beat inside it) is down, and uploads queue forever
  # without any request failing - so here, missing data is the alarm.
  WorkerHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No queue metrics from the worker for 10 minutes - worker or beat is down.
      Namespace: Arishem
      MetricName: IngestionInFlight
      Dimensions: [{Name: Service, Value: worker}]
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # One instance means no failover, so let EC2 repair what it can by itself:
  # move the instance to healthy hardware (same volume, same Elastic IP) when the
  # host fails, or reboot it when the OS stops responding.
  HostRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 system status check failing - recovering the instance onto new hardware.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"
        - !Ref AlarmTopic

  InstanceRebootAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 instance status check failing for 3 minutes - rebooting.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:reboot"
        - !Ref AlarmTopic

  # ── Cost guardrail ──────────────────────────────────────────────────────────
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUSD, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  SiteUrl:
    Description: Open this in a browser.
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "http://${ElasticIP}"]
  HealthUrl:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}/app/health"
      - !Sub "http://${ElasticIP}/app/health"
  ElasticIPAddress:
    Description: Point your domain's A record here.
    Value: !Ref ElasticIP
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  LogGroup:
    Description: Container logs; also where the EMF metrics are parsed from.
    Value: !Ref AppLogGroup
  ShellCommand:
    Description: Shell on the box without SSH or a key pair.
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"

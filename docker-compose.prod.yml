# Production stack for the single-instance deployment in deploy/cloudformation.yml.
# Everything runs on one small box: Postgres, Redis and Qdrant as containers,
# documents in S3 through the instance's IAM role, Caddy terminating TLS.
# Values come from /opt/arishem/.env, which the instance writes at first boot.

x-app: &app
  build: ./backend
  restart: unless-stopped
  volumes: [staticfiles:/home/arishem/app/staticfiles]
  environment: &app-env
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    DEBUG: "False"
    ALLOWED_HOSTS: ${PUBLIC_HOST},localhost,127.0.0.1
    CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
    CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
    # Caddy terminates TLS and forwards plain HTTP, so Django must not redirect
    # again when there is no certificate to redirect to.
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    QDRANT_URL: http://qdrant:6333
    QDRANT_COLLECTION: documents
    # No access keys: boto3 picks up the EC2 instance role.
    STORAGE_BACKEND: s3
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set OBJECT_STORAGE_BUCKET}
    OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-south-1}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CACHE_URL: redis://redis:6379/2
    GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY}
    # Empty is fine: /auth/google then answers 503 instead of verifying tokens
    # against an empty audience.
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    # USD per million tokens, for costing the recorded usage. These default to 0
    # rather than empty because settings casts them to float, and float("") raises
    # at import — an empty value here would stop the container from starting.
    LLM_INPUT_COST_PER_MTOK: ${LLM_INPUT_COST_PER_MTOK:-0}
    LLM_OUTPUT_COST_PER_MTOK: ${LLM_OUTPUT_COST_PER_MTOK:-0}
  depends_on: &app-deps
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    qdrant: {condition: service_started}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arishem
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: arishem
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arishem"]
      interval: 10s
      retries: 10
    deploy:
      resources: {limits: {memory: 320M}}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Celery's broker only holds short-lived task messages; cap it so a backlog
    # cannot eat the memory the embedding model needs.
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --save ""
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 10}
    deploy:
      resources: {limits: {memory: 96M}}

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    volumes: [qdrant:/qdrant/storage]
    deploy:
      resources: {limits: {memory: 640M}}

  migrate:
    <<: *app
    restart: "no"
    command: python manage.py migrate --noinput

  api:
    <<: *app
    # 2 workers is what a 2 GiB box holds once each has loaded the embedding model.
    command: >
      gunicorn backend.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --timeout 120 --access-logfile - --error-logfile -
    depends_on:
      <<: *app-deps
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/app/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    # -B runs beat inside the worker: one fewer Python process holding ~120 MiB.
    command: celery -A backend worker --beat --schedule /tmp/celerybeat-schedule --concurrency 1 --loglevel=info
    depends_on:
      <<: *app-deps
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /app
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddydata:/data           # keeps the TLS certificate across restarts
      - staticfiles:/srv/django-static:ro
    depends_on: [api]

volumes:
  pgdata:
  qdrant:
  staticfiles:
  caddydata:
